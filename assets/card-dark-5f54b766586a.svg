<title id="title">Carl Moebis (moebis)</title>
<desc id="desc">Terminal-style profile card for Carl Moebis (moebis). ASCII portrait of Carl, laughing, in dark sunglasses. Name: Carl Moebis. Host: Slovakia. Kernel: test, make, share. Platform: macOS, Apple Silicon. Language: Swift. AI Stack: MLX, OpenAI Realtime. Build With: AI, Tech. Build Hardware: 3D Printers, Drones. Build Also: whatever else refuses to behave. Projects: asus-fusion-vpn (VPN Fusion menu bar), cloud.point.cloud (video to 3D point cloud), Whisper (realtime dictation). Links: Web (moebis.com), GitHub (github.com/moebis).</desc>
